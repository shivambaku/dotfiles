<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="10240" height="2880" viewBox="0 0 10240 2880" role="img" aria-labelledby="title description">
  <title id="title">Biei: Lone Tree</title>
  <desc id="description">A matte blue-hour interpretation of the solitary Christmas Tree in a rolling Biei snowfield.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#668da3"/>
      <stop offset="0.48" stop-color="#8eacbc"/>
      <stop offset="1" stop-color="#c3d5dd"/>
    </linearGradient>
    <radialGradient id="horizonLight" cx="55%" cy="47%" r="58%">
      <stop offset="0" stop-color="#e2edf1" stop-opacity="0.62"/>
      <stop offset="0.48" stop-color="#bad0da" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7899aa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farSnow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce9ee"/>
      <stop offset="1" stop-color="#adc8d4"/>
    </linearGradient>
    <linearGradient id="nearSnow" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#e4eff3"/>
      <stop offset="0.52" stop-color="#c7dce4"/>
      <stop offset="1" stop-color="#91b5c5"/>
    </linearGradient>
    <linearGradient id="tree" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243a45"/>
      <stop offset="1" stop-color="#0d1b24"/>
    </linearGradient>
    <filter id="softCloud" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.65  0 0 0 0 0.70  0 0 0 0.055 0"/>
    </filter>
  </defs>

  <rect width="10240" height="2880" fill="url(#sky)"/>
  <rect width="10240" height="2140" fill="url(#horizonLight)"/>

