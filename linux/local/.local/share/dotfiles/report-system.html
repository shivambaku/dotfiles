<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>System Report</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #05070a;
      --surface: #0b0f14;
      --surface-raised: #13181e;
      --surface-hover: #223246;
      --text: #e1e8ec;
      --muted: #b8c3ca;
      --dim: #7d8992;
      --outline: #3a4652;
      --primary: #7fb5e5;
      --secondary: #a9cce8;
      --cyan: #78bbc4;
      --green: #9cb68e;
      --yellow: #d3b26f;
      --red: #d9858b;
      --magenta: #b3a1d6;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(rgba(127, 181, 229, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(127, 181, 229, 0.035) 1px, transparent 1px),
        var(--background);
      background-size: 24px 24px;
      color: var(--text);
      font-family: "CommitMono Nerd Font", "Noto Sans Mono", ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    a {
      color: var(--primary);
      text-underline-offset: 3px;
    }

    .page {
      width: min(1600px, 100%);
      margin: 0 auto;
      padding: 32px;
    }

    .masthead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--outline);
    }

    .eyebrow {
      margin: 0 0 4px;
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1;
    }

    h2 {
      font-size: 18px;
    }

    .generated {
      margin: 8px 0 0;
      color: var(--dim);
    }

    .status-mark {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 16px color-mix(in srgb, var(--green) 60%, transparent);
    }

    .status-mark.attention .status-dot {
      background: var(--yellow);
      box-shadow: 0 0 16px color-mix(in srgb, var(--yellow) 60%, transparent);
    }

    .status-mark.problem .status-dot {
      background: var(--red);
      box-shadow: 0 0 16px color-mix(in srgb, var(--red) 60%, transparent);
    }

    .collection-errors {
      display: none;
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid color-mix(in srgb, var(--yellow) 55%, var(--outline));
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--yellow) 8%, var(--surface));
      color: var(--yellow);
    }

    .collection-errors.visible {
      display: block;
    }

    .collection-errors ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(6, minmax(135px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      min-height: 112px;
      padding: 15px;
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--surface-raised) 90%, transparent);
    }

    .card-label {
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-value {
      display: block;
      margin: 10px 0 2px;
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
    }

    .card-note {
      color: var(--muted);
      font-size: 12px;
    }

    .card.error .card-value,
    .level-error,
    .level-critical,
    .level-alert,
    .level-emergency {
      color: var(--red);
    }

    .card.warning .card-value,
    .level-warning {
      color: var(--yellow);
    }

    .card.good .card-value {
      color: var(--green);
    }

    .system-state {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .state-panel {
      padding: 16px;
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .state-panel h2 {
      margin-bottom: 12px;
    }

    .facts {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 7px 18px;
      margin: 0;
    }

    .facts dt {
      color: var(--dim);
    }

    .facts dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .state-list {
      max-height: 150px;
      margin: 12px 0 0;
      padding-left: 20px;
      overflow: auto;
      color: var(--muted);
    }

    .events {
      border: 1px solid var(--outline);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }

    .events-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--outline);
    }

    .result-count {
      color: var(--dim);
      white-space: nowrap;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(130px, 1fr)) auto auto;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--outline);
      background: var(--surface-raised);
    }

    .control {
      display: grid;
      gap: 4px;
    }

    .control > span {
      color: var(--dim);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input[type="search"],
    select,
    button {
      min-height: 38px;
      border: 1px solid var(--outline);
      border-radius: 7px;
      background: var(--background);
      color: var(--text);
    }

    input[type="search"],
    select {
      width: 100%;
      padding: 7px 10px;
    }

    input:focus,
    select:focus,
    button:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 1px;
    }

    button {
      align-self: end;
      padding: 7px 13px;
      cursor: pointer;
    }

    button:hover {
      background: var(--surface-hover);
    }

    .group-control {
      display: flex;
      align-items: center;
      align-self: end;
      min-height: 38px;
      gap: 8px;
      padding: 0 4px;
      color: var(--muted);
      white-space: nowrap;
    }

    input[type="checkbox"] {
      accent-color: var(--primary);
    }

    .table-wrap {
      max-height: min(68vh, 900px);
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #0e1319;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--outline) 55%, transparent);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--dim);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    tbody tr:hover {
      background: color-mix(in srgb, var(--surface-hover) 35%, transparent);
    }

    .column-time {
      width: 168px;
    }

    .column-level {
      width: 92px;
    }

    .column-source {
      width: 240px;
    }

    .column-boot {
      width: 92px;
    }

    .time,
    .boot,
    .origin {
      color: var(--dim);
      font-size: 12px;
    }

    .level {
      font-size: 12px;
      font-weight: 650;
    }

    .source {
      overflow-wrap: anywhere;
    }

    .origin {
      display: block;
      margin-top: 2px;
    }

    details {
      min-width: 0;
    }

    summary {
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    details[open] summary {
      margin-bottom: 10px;
      overflow: visible;
      white-space: normal;
    }

    .repeat {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 6px;
      border: 1px solid var(--outline);
      border-radius: 999px;
      color: var(--secondary);
      font-size: 11px;
    }

    pre {
      max-height: 360px;
      margin: 0 0 12px;
      padding: 12px;
      overflow: auto;
      border-left: 2px solid var(--primary);
      background: var(--background);
      color: var(--muted);
      font: inherit;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .event-facts {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 3px 12px;
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .event-facts dt {
      color: var(--dim);
    }

    .event-facts dd {
      min-width: 0;
      margin: 0;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 40px 16px;
      color: var(--dim);
      text-align: center;
    }

    @media (max-width: 1150px) {
      .cards {
        grid-template-columns: repeat(3, 1fr);
      }

      .controls {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .search-control {
        grid-column: span 2;
      }
    }

    @media (max-width: 760px) {
      .page {
        padding: 18px 12px;
      }

      .masthead,
      .events-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .system-state,
      .controls {
        grid-template-columns: 1fr;
      }

      .search-control {
        grid-column: auto;
      }

      .controls button {
        align-self: stretch;
      }

      .table-wrap {
        max-height: none;
      }

      table,
      tbody {
        display: block;
      }

      thead {
        display: none;
      }

      .event-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding: 10px;
        border-bottom: 1px solid var(--outline);
      }

      .event-row td {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px;
        width: auto;
        padding: 5px;
        border: 0;
      }

      .event-row td::before {
        content: attr(data-label);
        color: var(--dim);
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .event-row .message-cell {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow" id="hostname">Local diagnostics</p>
        <h1>System Report</h1>
        <p class="generated" id="generated"></p>
      </div>
      <div class="status-mark" id="status-mark">
        <span class="status-dot"></span>
        <span id="status-text">Evaluating system state</span>
      </div>
    </header>

    <aside class="collection-errors" id="collection-errors">
      <strong>Some report sources could not be collected.</strong>
      <ul id="collection-error-list"></ul>
    </aside>

    <section class="cards" id="cards" aria-label="System health summary"></section>

    <section class="system-state" aria-label="System state details">
      <article class="state-panel">
        <h2>Kernel</h2>
        <dl class="facts" id="kernel-facts"></dl>
      </article>
      <article class="state-panel">
        <h2>Maintenance</h2>
        <dl class="facts" id="maintenance-facts"></dl>
        <ul class="state-list" id="maintenance-list"></ul>
      </article>
    </section>

    <section class="events">
      <header class="events-header">
        <h2>Recent Events</h2>
        <span class="result-count" id="result-count"></span>
      </header>
      <div class="controls">
        <label class="control search-control">
          <span>Search</span>
          <input type="search" id="search" placeholder="message, unit, executable..." autofocus>
        </label>
        <label class="control">
          <span>Boot</span>
          <select id="boot-filter">
            <option value="all">All boots</option>
            <option value="current">Current boot</option>
            <option value="previous">Previous boot</option>
          </select>
        </label>
        <label class="control">
          <span>Level</span>
          <select id="level-filter">
            <option value="all">All levels</option>
            <option value="errors">Errors and above</option>
            <option value="warnings">Warnings</option>
          </select>
        </label>
        <label class="control">
          <span>Origin</span>
          <select id="origin-filter">
            <option value="all">All origins</option>
            <option value="Journal">Journal</option>
            <option value="Noctalia">Noctalia</option>
          </select>
        </label>
        <label class="control">
          <span>Source</span>
          <select id="source-filter">
            <option value="all">All sources</option>
          </select>
        </label>
        <label class="group-control">
          <input type="checkbox" id="group-repeats" checked>
          Group repeats
        </label>
        <button type="button" id="copy-visible">Copy visible</button>
      </div>
      <div class="table-wrap">
        <table class="events-table">
          <thead>
            <tr>
              <th class="column-time">Time</th>
              <th class="column-level">Level</th>
              <th class="column-source">Source</th>
              <th>Message</th>
              <th class="column-boot">Boot</th>
            </tr>
          </thead>
          <tbody id="event-rows"></tbody>
        </table>
        <p class="empty" id="empty" hidden>No events match these filters.</p>
      </div>
    </section>
  </main>

  <script type="application/octet-stream" id="report-data">__REPORT_DATA__</script>
  <script>
    "use strict";

    const CORE_DUMP_MESSAGE_ID = "fc2e22bc6ee647b6b90729ab34a250b1";
    const encoded = document.getElementById("report-data").textContent.trim();
    const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    const report = JSON.parse(new TextDecoder().decode(bytes));
    const controls = {
      search: document.getElementById("search"),
      boot: document.getElementById("boot-filter"),
      level: document.getElementById("level-filter"),
      origin: document.getElementById("origin-filter"),
      source: document.getElementById("source-filter"),
      group: document.getElementById("group-repeats")
    };
    let visibleEvents = [];
    let renderPending = false;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function eventTime(event) {
      if (event.time_us) return Number(event.time_us) / 1000;
      if (event.time_local) return new Date(event.time_local.replace(" ", "T")).getTime();
      return 0;
    }

    function formatTime(milliseconds) {
      if (!Number.isFinite(milliseconds) || milliseconds <= 0) return "Unknown";
      return new Date(milliseconds).toLocaleString([], {
        year: "numeric",
        month: "short",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function addFact(list, term, value) {
      list.append(element("dt", "", term), element("dd", "", value));
    }

    function addLinkFact(list, term, label, url) {
      const definition = element("dd");
      if (url) {
        const link = element("a", "", label);
        link.href = url;
        link.target = "_blank";
        link.rel = "noreferrer";
        definition.append(link);
      } else {
        definition.textContent = label;
      }
      list.append(element("dt", "", term), definition);
    }

    function createCard(label, value, note, tone) {
      const card = element("article", `card ${tone || ""}`);
      card.append(
        element("span", "card-label", label),
        element("strong", "card-value", String(value)),
        element("span", "card-note", note)
      );
      return card;
    }

    function renderSummary() {
      const errors = report.events.filter(event => event.priority <= 3).length;
      const warnings = report.events.filter(event => event.priority === 4).length;
      const crashes = report.events.filter(event =>
        event.details?.message_id === CORE_DUMP_MESSAGE_ID || event.details?.coredump_executable
      ).length;
      const failedUnits = report.health.failed_system_units.length + report.health.failed_user_units.length;
      const configUpdates = report.health.config_updates.length;
      const rebootRequired = report.kernel.reboot_required;
      const rebootKnown = typeof rebootRequired === "boolean";
      const eventsKnown = report.availability.events;
      const crashesKnown = report.availability.crashes;
      const unitsKnown = report.availability.failed_system_units && report.availability.failed_user_units;
      const configKnown = report.availability.config_updates;
      const cards = document.getElementById("cards");

      cards.append(
        createCard("Errors", eventsKnown ? errors : "UNKNOWN", eventsKnown ? "current + previous boot" : "collection failed", eventsKnown ? (errors ? "error" : "good") : "warning"),
        createCard("Warnings", eventsKnown ? warnings : "UNKNOWN", eventsKnown ? "current + previous boot" : "collection failed", eventsKnown ? (warnings ? "warning" : "good") : "warning"),
        createCard("Crashes", crashesKnown ? crashes : "UNKNOWN", crashesKnown ? "recorded core dumps" : "collection failed", crashesKnown ? (crashes ? "error" : "good") : "warning"),
        createCard("Failed units", unitsKnown ? failedUnits : "UNKNOWN", unitsKnown ? "system and user" : "collection failed", unitsKnown ? (failedUnits ? "error" : "good") : "warning"),
        createCard("Config files", configKnown ? configUpdates : "UNKNOWN", configKnown ? "pending pacnew/pacsave" : "collection failed", configKnown ? (configUpdates ? "warning" : "good") : "warning"),
        createCard(
          "Kernel",
          rebootKnown ? (rebootRequired ? "REBOOT" : "CURRENT") : "UNKNOWN",
          rebootKnown ? (rebootRequired ? "new kernel installed" : "running installed kernel") : "status unavailable",
          rebootKnown ? (rebootRequired ? "warning" : "good") : "warning"
        )
      );

      const statusMark = document.getElementById("status-mark");
      const statusText = document.getElementById("status-text");
      if (errors || crashes || failedUnits) {
        statusMark.classList.add("problem");
        statusText.textContent = report.collection_errors.length
          ? "Problems found; report is incomplete"
          : "Problems found in recent history";
      } else if (report.collection_errors.length) {
        statusMark.classList.add("attention");
        statusText.textContent = "Report incomplete; review collection errors";
      } else if (warnings || configUpdates || rebootRequired) {
        statusMark.classList.add("attention");
        statusText.textContent = "Review recommended";
      } else {
        statusText.textContent = "No recent problems found";
      }
    }

    function renderSystemState() {
      const kernelFacts = document.getElementById("kernel-facts");
      const maintenanceFacts = document.getElementById("maintenance-facts");
      const maintenanceList = document.getElementById("maintenance-list");
      const failedSystem = report.health.failed_system_units;
      const failedUser = report.health.failed_user_units;
      const update = report.kernel.last_update;
      const installedKernels = report.kernel.installed_kernels || [];
      const installedLabel = installedKernels.length
        ? installedKernels.map(kernel => `${kernel.package}: ${kernel.release}`).join(", ")
        : "Unknown";

      addFact(kernelFacts, "Running", report.kernel.running_release || "Unknown");
      addFact(kernelFacts, "Installed", installedLabel);
      addFact(
        kernelFacts,
        "Reboot",
        typeof report.kernel.reboot_required === "boolean"
          ? (report.kernel.reboot_required ? "Required" : "Not required")
          : "Unknown"
      );
      if (update) {
        const transition = update.from ? `${update.from} -> ${update.to}` : `installed ${update.to}`;
        addFact(kernelFacts, "Last update", `${update.time}: ${update.package} ${transition}`);
      }
      addLinkFact(kernelFacts, "Arch package", report.kernel.active_package || "kernel package", report.kernel.package_url);
      addLinkFact(kernelFacts, "Upstream", "kernel changelog", report.kernel.changelog_url);

      addFact(maintenanceFacts, "Failed system", report.availability.failed_system_units ? String(failedSystem.length) : "Unknown");
      addFact(maintenanceFacts, "Failed user", report.availability.failed_user_units ? String(failedUser.length) : "Unknown");
      addFact(maintenanceFacts, "Config updates", report.availability.config_updates ? String(report.health.config_updates.length) : "Unknown");
      addFact(maintenanceFacts, "Boots included", report.boots.map(boot => boot.label).join(", "));

      const entries = [
        ...failedSystem.map(unit => `System unit: ${unit.unit} (${unit.sub})`),
        ...failedUser.map(unit => `User unit: ${unit.unit} (${unit.sub})`),
        ...report.health.config_updates.map(path => `Config update: ${path}`)
      ];
      const maintenanceKnown = report.availability.failed_system_units
        && report.availability.failed_user_units
        && report.availability.config_updates;
      if (!entries.length && maintenanceKnown) entries.push("No failed units or pending configuration files.");
      if (!maintenanceKnown) entries.push("Some maintenance checks were unavailable.");
      for (const entry of entries) maintenanceList.append(element("li", "", entry));
    }

    function populateSources() {
      const sources = [...new Set(report.events.map(event => event.source))]
        .sort((left, right) => left.localeCompare(right));
      for (const source of sources) {
        const option = element("option", "", source);
        option.value = source;
        controls.source.append(option);
      }
    }

    function searchableText(event) {
      return [event.level, event.origin, event.source, event.message, event.boot, JSON.stringify(event.details || {})]
        .join(" ")
        .toLocaleLowerCase();
    }

    function matchesFilters(event) {
      const query = controls.search.value.trim().toLocaleLowerCase();
      if (controls.boot.value !== "all" && event.boot !== controls.boot.value) return false;
      if (controls.level.value === "errors" && event.priority > 3) return false;
      if (controls.level.value === "warnings" && event.priority !== 4) return false;
      if (controls.origin.value !== "all" && event.origin !== controls.origin.value) return false;
      if (controls.source.value !== "all" && event.source !== controls.source.value) return false;
      return !query || searchableText(event).includes(query);
    }

    function groupEvents(events) {
      if (!controls.group.checked) {
        return events.map(event => ({...event, count: 1, firstTime: eventTime(event), lastTime: eventTime(event)}));
      }

      const groups = new Map();
      for (const event of events) {
        const timestamp = eventTime(event);
        const key = [event.boot, event.priority, event.origin, event.source, event.message].join("\u0000");
        const existing = groups.get(key);
        if (existing) {
          existing.count += 1;
          existing.firstTime = Math.min(existing.firstTime, timestamp);
          existing.lastTime = Math.max(existing.lastTime, timestamp);
          if (timestamp >= eventTime(existing)) Object.assign(existing, event);
        } else {
          groups.set(key, {...event, count: 1, firstTime: timestamp, lastTime: timestamp});
        }
      }
      return [...groups.values()];
    }

    function eventRow(event) {
      const row = element("tr", "event-row");
      const time = element("td", "time", formatTime(event.lastTime));
      const level = element("td", `level level-${event.level.toLowerCase()}`, event.level);
      const source = element("td", "source");
      const message = element("td", "message-cell");
      const boot = element("td", "boot", event.boot);
      const details = element("details");
      const summary = element("summary", "", event.message.replaceAll("\n", " "));
      const fullMessage = element("pre", "", event.message);
      const facts = element("dl", "event-facts");

      time.dataset.label = "Time";
      level.dataset.label = "Level";
      source.dataset.label = "Source";
      message.dataset.label = "Message";
      boot.dataset.label = "Boot";
      if (event.count > 1) {
        summary.append(element("span", "repeat", `x${event.count}`));
        time.title = `${formatTime(event.firstTime)} through ${formatTime(event.lastTime)}`;
        addFact(facts, "Occurrences", String(event.count));
        addFact(facts, "First seen", formatTime(event.firstTime));
        addFact(facts, "Last seen", formatTime(event.lastTime));
      }
      for (const [name, value] of Object.entries(event.details || {})) {
        addFact(facts, name.replaceAll("_", " "), String(value));
      }
      source.append(document.createTextNode(event.source), element("span", "origin", event.origin));
      details.append(summary, fullMessage, facts);
      message.append(details);
      row.append(time, level, source, message, boot);
      return row;
    }

    function renderEvents() {
      renderPending = false;
      const filtered = report.events.filter(matchesFilters);
      visibleEvents = groupEvents(filtered).sort((left, right) => right.lastTime - left.lastTime);
      const rows = document.getElementById("event-rows");
      const fragment = document.createDocumentFragment();
      for (const event of visibleEvents) fragment.append(eventRow(event));
      rows.replaceChildren(fragment);

      const empty = document.getElementById("empty");
      empty.hidden = visibleEvents.length !== 0;
      document.getElementById("result-count").textContent = controls.group.checked
        ? `${visibleEvents.length} groups from ${filtered.length} events`
        : `${visibleEvents.length} events`;
    }

    function scheduleRender() {
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(renderEvents);
    }

    function copyVisible() {
      const text = visibleEvents.map(event => {
        const count = event.count > 1 ? ` x${event.count}` : "";
        return `${formatTime(event.lastTime)}\t${event.level}\t${event.source}\t${event.boot}${count}\t${event.message}`;
      }).join("\n");
      const button = document.getElementById("copy-visible");
      const copied = () => {
        button.textContent = `Copied ${visibleEvents.length}`;
        setTimeout(() => { button.textContent = "Copy visible"; }, 1600);
      };

      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(text).then(copied, () => fallbackCopy(text, copied));
      } else {
        fallbackCopy(text, copied);
      }
    }

    function fallbackCopy(text, callback) {
      const area = element("textarea");
      area.value = text;
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      const copied = document.execCommand("copy");
      area.remove();
      if (copied) {
        callback();
      } else {
        const button = document.getElementById("copy-visible");
        button.textContent = "Copy failed";
        setTimeout(() => { button.textContent = "Copy visible"; }, 1600);
      }
    }

    document.getElementById("hostname").textContent = `${report.hostname} / local diagnostics`;
    document.getElementById("generated").textContent =
      `Generated ${new Date(report.generated_at).toLocaleString()} / newest ${report.limits.journal_events_per_boot.toLocaleString()} journal events per boot`;
    if (report.collection_errors.length) {
      const banner = document.getElementById("collection-errors");
      banner.classList.add("visible");
      for (const error of report.collection_errors) {
        document.getElementById("collection-error-list").append(element("li", "", error));
      }
    }

    renderSummary();
    renderSystemState();
    populateSources();
    renderEvents();
    for (const control of Object.values(controls)) control.addEventListener("input", scheduleRender);
    document.getElementById("copy-visible").addEventListener("click", copyVisible);
  </script>
</body>
</html>
