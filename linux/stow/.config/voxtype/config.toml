engine = "parakeet"
state_file = "auto"

[hotkey]
enabled = false

[parakeet]
model = "parakeet-unified-en-0.6b"
on_demand_loading = false
streaming = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 120

[output]
mode = "type"
fallback_to_clipboard = true

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = true

[text]
spoken_punctuation = true
replacements = { "type script" = "TypeScript", "post gray sequel" = "PostgreSQL", "high per land" = "Hyprland" }
