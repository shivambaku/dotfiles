[mgr]
syntect_theme = "~/.config/bat/themes/dotfiles.tmTheme"

cwd = { fg = "#78BBC4" }

find_keyword = { fg = "#A9CCE8", italic = true }
find_position = { fg = "#6F9FD0", bg = "reset", italic = true }

marker_copied = { fg = "#9CB68E", bg = "#9CB68E" }
marker_cut = { fg = "#D9858B", bg = "#D9858B" }
marker_marked = { fg = "#78BBC4", bg = "#78BBC4" }
marker_selected = { fg = "#7FB5E5", bg = "#7FB5E5" }

count_copied = { fg = "#05070A", bg = "#9CB68E" }
count_cut = { fg = "#05070A", bg = "#D9858B" }
count_selected = { fg = "#05070A", bg = "#7FB5E5" }

border_symbol = "│"
border_style = { fg = "#7D8992" }

[tabs]
active = { fg = "#E1E8EC", bg = "#223246", bold = true }
inactive = { fg = "#7D8992", bg = "#1B232B" }

[mode]
normal_main = { fg = "#05070A", bg = "#7FB5E5", bold = true }
normal_alt = { fg = "#7FB5E5", bg = "#13181E" }

select_main = { fg = "#05070A", bg = "#9CB68E", bold = true }
select_alt = { fg = "#9CB68E", bg = "#13181E" }

unset_main = { fg = "#05070A", bg = "#A9CCE8", bold = true }
unset_alt = { fg = "#A9CCE8", bg = "#13181E" }

[indicator]
parent = { fg = "#05070A", bg = "#E1E8EC" }
current = { fg = "#05070A", bg = "#7FB5E5" }
preview = { fg = "#05070A", bg = "#E1E8EC" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

progress_label = { fg = "#E1E8EC", bold = true }
progress_normal = { fg = "#9CB68E", bg = "#1B232B" }
progress_error = { fg = "#05070A", bg = "#D9858B" }

perm_type = { fg = "#7FB5E5" }
perm_read = { fg = "#B8C3CA" }
perm_write = { fg = "#D3B26F" }
perm_exec = { fg = "#9CB68E" }
perm_sep = { fg = "#7D8992" }

[input]
border = { fg = "#7FB5E5" }
title = {}
value = {}
selected = { fg = "#E1E8EC", bg = "#223246" }

[pick]
border = { fg = "#7FB5E5" }
active = { fg = "#E1E8EC", bg = "#223246", bold = true }
inactive = { fg = "#7D8992" }

[confirm]
border = { fg = "#7FB5E5" }
title = { fg = "#7FB5E5" }
body = {}
list = { fg = "#7D8992" }
btn_yes = { fg = "#E1E8EC", bg = "#223246", bold = true }
btn_no = { fg = "#7D8992", bg = "#1B232B" }

[cmp]
border = { fg = "#7FB5E5" }
active = { fg = "#E1E8EC", bg = "#223246", bold = true }
inactive = { fg = "#7D8992" }

[tasks]
border = { fg = "#7FB5E5" }
title = {}
hovered = { fg = "#E1E8EC", bg = "#223246", bold = true }

[which]
mask = { bg = "#13181E" }
cand = { fg = "#78BBC4" }
rest = { fg = "#7D8992" }
desc = { fg = "#B3A1D6" }
separator = "  "
separator_style = { fg = "#7D8992" }

[help]
on = { fg = "#78BBC4" }
run = { fg = "#B3A1D6" }
desc = { fg = "#7D8992" }
hovered = { fg = "#E1E8EC", bg = "#223246", bold = true }
footer = { fg = "#E1E8EC", bg = "#1B232B" }

[notify]
title_info = { fg = "#78BBC4" }
title_warn = { fg = "#D3B26F" }
title_error = { fg = "#D9858B" }

[filetype]
rules = [
  # Media
  { mime = "image/*", fg = "#78BBC4" },
  { mime = "{audio,video}/*", fg = "#6F9FD0" },

  # Archives
  { mime = "application/*zip", fg = "#B3A1D6" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#B3A1D6" },

  # Documents
  { mime = "application/{pdf,doc,rtf}", fg = "#B8C3CA" },

  # Virtual file system
  { mime = "vfs/{absent,stale}", fg = "#7D8992" },

  # Special files
  { url = "*", is = "orphan", fg = "#D9858B" },
  { url = "*", is = "exec", fg = "#9CB68E" },
  { url = "*", is = "dummy", fg = "#D9858B" },
  { url = "*/", is = "dummy", fg = "#D9858B" },

  # Fallback
  { url = "*/", fg = "#7FB5E5" },
]

[spot]
border = { fg = "#7FB5E5" }
title = { fg = "#7FB5E5" }
tbl_cell = { fg = "#E1E8EC", bg = "#223246", bold = true }
tbl_col = { bold = true }

[icon]
globs = []
dirs = []
files = []
exts = []
conds = [
  { if = "orphan | dummy", text = "", fg = "#D9858B" },
  { if = "link", text = "", fg = "#A9CCE8" },
  { if = "block | char | fifo | sock | sticky", text = "", fg = "#B3A1D6" },
  { if = "dir & hovered", text = "", fg = "#A9CCE8" },
  { if = "dir", text = "", fg = "#7FB5E5" },
  { if = "exec", text = "", fg = "#9CB68E" },
  { if = "!dir", text = "", fg = "#B8C3CA" },
]
