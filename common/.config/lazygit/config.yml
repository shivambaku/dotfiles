git:
  autoFetch: false
  diffContextSize: 0
  diffRenderers:
    - colorArg: always
      command: delta --config "${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles/theme/delta.gitconfig" --features="dotfiles"
    - colorArg: always
      command: delta --config "${XDG_CONFIG_HOME:-$HOME/.config}/dotfiles/theme/delta.gitconfig" --features="dotfiles" -s
promptToReturnFromSubprocess: false
gui:
  sidePanelWidth: 0.4
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3
  wrapLinesInStagingView: false
  showBottomLine: false
  showCommandLog: false
  showFileTree: false
  showNumstatInFilesView: true
  showPanelJumps: true
  showRandomTip: false
  theme:
    activeBorderColor:
      - '#a9cce8'
      - bold
    inactiveBorderColor:
      - '#3a4652'
    optionsTextColor:
      - '#7fb5e5'
    selectedLineBgColor:
      - '#223246'
    cherryPickedCommitBgColor:
      - '#1b232b'
    cherryPickedCommitFgColor:
      - '#a9cce8'
    unstagedChangesColor:
      - '#d9858b'
    defaultFgColor:
      - '#e1e8ec'
    searchingActiveBorderColor:
      - '#d3b26f'
  authorColors:
    '*': '#b3a1d6'
